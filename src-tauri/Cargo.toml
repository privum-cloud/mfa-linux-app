[package]
name = "tessera"
version = "0.5.0"
description = "Tessera — open-source authenticator for Linux, Windows and macOS"
authors = ["Privum Cloud"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "tessera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base32 = "0.5"
thiserror = "2"
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"
url = "2"
dirs = "5"
percent-encoding = "2"
base64 = "0.22"
rqrr = "0.10"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Desktop only: there is no self-replacing package on a phone.
[target."cfg(any(target_os = \"linux\", target_os = \"windows\", target_os = \"macos\"))".dependencies]
tauri-plugin-updater = "2"
