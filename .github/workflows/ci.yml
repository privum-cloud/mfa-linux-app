name: ci

on:
  push:
    # feature branches too, so a broken workflow surfaces on the branch that
    # broke it rather than at merge time
    branches: [main, "feat/**"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Tauri links against the system webkit; without these the crate does not
      # build, even though nothing under test touches a window.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      # Pinned to match rust-toolchain.toml. @stable drifts, and a lint added
      # to a newer clippy fails commits that were clean when written.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test --all
        working-directory: src-tauri

  # The macOS build links against nothing that needs installing, so this is
  # only the tests — enough to catch a cfg(unix) path that behaves differently
  # on Darwin before a release finds it.
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        run: cargo test --all
        working-directory: src-tauri

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
