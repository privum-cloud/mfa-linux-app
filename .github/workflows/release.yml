name: release

# Fires on a version tag. Everything below is what used to be a person at a
# terminal, which meant a release could only happen when that person was free.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # gh is preinstalled on every runner and reads this.
  GH_TOKEN: ${{ github.token }}

jobs:
  # A draft first, so the two build jobs have somewhere to upload to and a
  # half-finished release is never visible.
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Open a draft release
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Tessera ${GITHUB_REF_NAME#v}" \
            --draft --generate-notes

  linux:
    needs: draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the libraries Tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      # rustup ships with the runner and reads rust-toolchain.toml, so the
      # pinned version arrives without a third-party action. This workflow
      # produces the binaries people install; the fewer hands on that path the
      # better.
      - name: Show the toolchain
        run: rustc --version && cargo --version

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run tauri build -- --bundles deb,rpm,appimage
        env:
          # Without these the bundler still builds, but produces no .sig files
          # and the manifest step below refuses to publish an empty manifest.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Attach the Linux packages and their signatures
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --clobber \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/deb/*.deb.sig \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/rpm/*.rpm.sig \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show the toolchain
        run: rustc --version; cargo --version

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # NSIS rather than MSI: it needs no WiX toolset and produces one
      # self-contained installer.
      - run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Attach the Windows installer and its signature
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --clobber \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  macos:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # One universal binary rather than one build per architecture: the
      # updater artefact is named Tessera.app.tar.gz with no architecture in
      # it, so two builds would overwrite each other on the release. Both
      # targets have to be present for the toolchain to link them together.
      - name: Add both Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Show the toolchain
        run: rustc --version && cargo --version

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # No Apple Developer ID here: the bundle is ad-hoc signed, which is all
      # macOS needs to run it. Gatekeeper warns once on a browser download and
      # the README says what to click; see docs/macos-support.md.
      - run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Attach the disk image and the updater archive with its signature
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --clobber \
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Installed copies find this file at releases/latest/download/latest.json,
      # so it has to be attached before the draft is lifted: the moment this
      # release becomes "latest" is the moment that URL starts resolving here.
      - name: Build and attach the update manifest
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --pattern '*.sig' --dir sigs
          python3 scripts/build-update-manifest.py \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --sigs sigs --out latest.json
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --clobber latest.json

      # Only once every platform uploaded. A release missing half its packages
      # is worse than one that arrives a few minutes later.
      - name: Publish
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --draft=false --latest
